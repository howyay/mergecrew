# Temporary workflow: regenerate docs/openapi.json and packages/sdk-ts/src/generated.ts.
#
# Local NixOS has no Prisma engine, so these generators cannot run on the workstation.
# This workflow produces both files as artifacts. It is deleted from the branch before
# the pull request is finalized.
name: Regenerate API artifacts

on:
  push:
    branches: [gc/api-city-module]
  workflow_dispatch:

jobs:
  regen:
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-latest' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mergecrew
          POSTGRES_PASSWORD: mergecrew
          POSTGRES_DB: mergecrew
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mergecrew -d mergecrew"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://mergecrew:mergecrew@localhost:5432/mergecrew?schema=public
      DATABASE_MIGRATE_URL: postgresql://mergecrew:mergecrew@localhost:5432/mergecrew?schema=public
      REDIS_URL: redis://localhost:6379
      KMS_MASTER_KEY: base64:0000000000000000000000000000000000000000000=
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile=false --store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Bootstrap Postgres roles + extensions
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=mergecrew \
            -v "$PWD/infra/sql/init:/sql:ro" \
            postgres:16-alpine \
            psql -h localhost -U mergecrew -d mergecrew -f /sql/00-roles.sql
      - run: pnpm --filter @mergecrew/db generate
      - run: pnpm --filter @mergecrew/db migrate
      - run: pnpm build
      - name: Regenerate the OpenAPI spec
        run: pnpm --filter @mergecrew/api openapi:export
      - name: Regenerate the SDK types
        run: pnpm --filter @mergecrew/sdk generate
      - name: Upload the regenerated files
        uses: actions/upload-artifact@v4
        with:
          name: api-artifacts
          path: |
            docs/openapi.json
            packages/sdk-ts/src/generated.ts
          if-no-files-found: error
