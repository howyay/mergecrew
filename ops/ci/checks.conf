# Commands for the primitive CI loop, one per line, in order.
# Blank lines and lines starting with `#` are ignored.
# A trailing ` # comment` is stripped.
#
# Runs with cwd = repo root. First failure stops the pipeline (fail fast).
# Keep the first entries cheap so a broken commit fails in seconds, not minutes.

node --test "ops/ci/test/*.test.mjs"
node --test "ops/ideation/test/*.test.mjs"
# The whole chain that runs on swipe: PRD -> issue -> worktree -> dev -> UAT.
# These tests are the only thing standing between a broken stage and a card that
# silently never moves.
node --test "ops/pipeline/test/*.test.mjs"
pnpm -w lint:no-raw-sql
# The web app is the thing users actually see on sd.yay.how. Nothing else here
# looks at apps/web, so a UI change used to ship with zero automated checks;
# this catches a broken import or a bad icon name before the image rebuild.
pnpm --filter @mergecrew/web exec tsc --noEmit
# The Forgejo tracker adapter: label names must be resolved to ids before the
# issue is filed, which is a bug the real instance found and no test had.
pnpm --filter @mergecrew/adapters-tracker test

# Heavier suites — enable when you accept the runtime cost:
# pnpm --filter @mergecrew/domain test
# pnpm -w typecheck
